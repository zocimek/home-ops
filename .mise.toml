[env]
_.python.venv = { path = "{{config_root}}/.venv", create = true }
ROOT_DIR = "{{config_root}}"
KUBECONFIG = "{{ env.HOME }}/.kube/configs/config.homelab"
TALOSCONFIG = '{{config_root}}/talos/clusterconfig/talosconfig'
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"

[tools]
"python" = "3.14.7"
"pipx:makejinja" = "2.8.2"
# Pinned back from 0.20.0: upstream retracted that GitHub release but left the
# tag in place, and aqua installs from releases, so 0.20.0 404s on install and
# fails every mise-based CI job. Restore once cilium republishes the release.
"aqua:cilium/cilium-cli" = "0.20.0"
"aqua:budimanjojo/talhelper" = "3.1.17"
"aqua:cli/cli" = "2.98.0"
"aqua:cue-lang/cue" = "0.17.1"
"aqua:cloudflare/cloudflared" = "2026.8.3"
"aqua:FiloSottile/age" = "1.3.2"
"aqua:helmfile/helmfile" = "1.7.4"
"aqua:getsops/sops" = "3.13.3"
"aqua:fluxcd/flux2" = "2.9.4"
"aqua:go-task/task" = "3.53.1"
"aqua:helm/helm" = "4.2.4"
"aqua:jqlang/jq" = "1.7.1"
"aqua:kubernetes-sigs/kustomize" = "5.6.0"
"aqua:kubernetes/kubectl" = "1.33.1"
"aqua:siderolabs/talos" = "1.13.9"
"aqua:mikefarah/yq" = "4.53.6"
"aqua:yannh/kubeconform" = "0.8.0"
uv = "latest"
