---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Image Pull

on:
  pull_request:
    branches:
      - "main"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  filter:
    name: Image Pull - Filter
    runs-on: home-ops-runner
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
    steps:
      - name: Get Changed Files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@a9a36fb08ce06db9b02fbd8026cc2c0945eb9841 # v0.6.0
        with:
          patterns: kubernetes/**/*

  pull:
    if: ${{ needs.filter.outputs.changed-files != '[]' }}
    needs: filter
    name: Image Pull - Pull Images
    runs-on: home-ops-runner
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Full history: flate picks its baseline by resolving --base, which a
          # shallow clone cannot do.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          cache: false
          tool_versions: |
            github:home-operations/flate 0.6.0
            aqua:siderolabs/talos 1.13.2

      # `diff images` emits ONLY images the PR adds - --include-removed would
      # also emit ones it deletes, which are exactly what we don't want to pull.
      # --path points at the Flux entrypoint; flate follows each Kustomization's
      # spec.path from there to discover the rest of the tree.
      - name: Extract Images
        run: |
          flate diff images \
            --path ./kubernetes/flux/cluster \
            --base "origin/${{ github.base_ref }}" \
            --output json > images.json
          {
            echo '## Images to pull'
            echo '```json'
            jq '.' images.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # xargs -r: an empty array must be a no-op, not a talosctl invocation with
      # no image argument.
      - name: Pull Images
        run: jq -r '.[]' images.json | xargs -r -n1 talosctl --nodes "$NODE" image pull

  success:
    if: ${{ !cancelled() }}
    needs: ["filter", "pull"]
    name: Image Pull - Success
    runs-on: home-ops-runner
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
