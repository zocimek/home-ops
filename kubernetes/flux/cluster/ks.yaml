---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps
  namespace: flux-system
spec:
  interval: 1h
  path: ./kubernetes/apps
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  decryption:
    provider: sops
  deletionPolicy: WaitForTermination
  patches:
    - # Add Kustomization defaults for all child Kustomizations
      patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: _
        spec:
          decryption:
            provider: sops
          deletionPolicy: WaitForTermination
          patches:
            - patch: |-
                apiVersion: helm.toolkit.fluxcd.io/v2
                kind: HelmRelease
                metadata:
                  name: _
                spec:
                  install:
                    crds: CreateReplace
                    strategy:
                      name: RetryOnFailure
                  rollback:
                    cleanupOnFail: true
                    recreate: true
                  driftDetection:
                    mode: enabled # undo kubectl edits and other unintended changes
                  upgrade:
                    cleanupOnFail: true
                    crds: CreateReplace
                    strategy:
                      name: RemediateOnFailure
                    remediation:
                      remediateLastFailure: true
                      retries: 2
              target:
                group: helm.toolkit.fluxcd.io
                kind: HelmRelease
            - patch: |-
                apiVersion: helm.toolkit.fluxcd.io/v2
                kind: HelmRelease
                metadata:
                  name: _
                spec:
                  driftDetection:
                    mode: disabled
              target:
                group: helm.toolkit.fluxcd.io
                kind: HelmRelease
                name: rook-ceph-cluster
            - # authentik migrations outlive an upgrade window, and rolling
              # back part-way through one leaves the schema ahead of the code.
              # Leaving a failed upgrade in place is safer: the Deployment is
              # RollingUpdate, so pods that never go Ready never replace the
              # running ones, and the failure stays visible.
              patch: |-
                apiVersion: helm.toolkit.fluxcd.io/v2
                kind: HelmRelease
                metadata:
                  name: _
                spec:
                  upgrade:
                    remediation:
                      retries: 0
                      remediateLastFailure: false
              target:
                group: helm.toolkit.fluxcd.io
                kind: HelmRelease
                name: authentik
            - # meilisearch migrations outlive an upgrade window, and a
              # rollback mid-migration restores the manifest that could not
              # start in the first place - a loop, not a recovery.
              patch: |-
                apiVersion: helm.toolkit.fluxcd.io/v2
                kind: HelmRelease
                metadata:
                  name: _
                spec:
                  upgrade:
                    remediation:
                      retries: 0
                      remediateLastFailure: false
              target:
                group: helm.toolkit.fluxcd.io
                kind: HelmRelease
                name: karakeep
            - # A paperless v3 index rebuild outlives the upgrade window, and
              # this is a StatefulSet - rolling back restarts the rebuild
              # rather than falling back to something that still works.
              patch: |-
                apiVersion: helm.toolkit.fluxcd.io/v2
                kind: HelmRelease
                metadata:
                  name: _
                spec:
                  upgrade:
                    remediation:
                      retries: 0
                      remediateLastFailure: false
              target:
                group: helm.toolkit.fluxcd.io
                kind: HelmRelease
                name: paperless
            - patch: |-
                apiVersion: helm.toolkit.fluxcd.io/v2
                kind: HelmRelease
                metadata:
                  name: _
                spec:
                  driftDetection:
                    mode: disabled
              target:
                group: helm.toolkit.fluxcd.io
                kind: HelmRelease
                name: inzosoft-amd64
            - patch: |-
                apiVersion: helm.toolkit.fluxcd.io/v2
                kind: HelmRelease
                metadata:
                  name: _
                spec:
                  driftDetection:
                    mode: disabled
              target:
                group: helm.toolkit.fluxcd.io
                kind: HelmRelease
                name: poetica-amd64

      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
