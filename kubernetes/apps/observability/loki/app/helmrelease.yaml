---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: loki
  values:
    deploymentMode: SingleBinary
    loki:
      analytics:
        reporting_enabled: false
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      compactor:
        working_directory: /var/loki/compactor
        delete_request_store: filesystem
        retention_enabled: true
      ingester:
        chunk_encoding: snappy
      limits_config:
        retention_period: 14d
        ingestion_rate_mb: 16
        ingestion_burst_size_mb: 32
        max_cache_freshness_per_query: 10m
        split_queries_by_interval: 15m
      rulerConfig:
        enable_api: true
        enable_alertmanager_v2: true
        alertmanager_url: http://alertmanager-operated.observability.svc.cluster.local:9093
        wal:
          dir: /var/loki/ruler-wal
        # The rules sidecar drops per-app rule files into /rules/fake ("fake" is the
        # tenant id used when auth_enabled is false), rule_path is scratch space.
        storage:
          type: local
          local:
            directory: /rules
        rule_path: /var/loki/rules-tmp
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      server:
        log_level: info
        grpc_server_max_recv_msg_size: 10485760 # 10 MiB
        grpc_server_max_send_msg_size: 10485760 # 10 MiB
      storage:
        type: filesystem
        bucketNames:
          chunks: chunks
    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        storageClass: ceph-block
        size: 50Gi
      resources:
        requests:
          cpu: 100m
        limits:
          memory: 2Gi
    sidecar:
      rules:
        searchNamespace: ["ALL"]
        folder: /rules/fake
    monitoring:
      serviceMonitor:
        enabled: true
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    gateway:
      enabled: false
    lokiCanary:
      enabled: false
    test:
      enabled: false
