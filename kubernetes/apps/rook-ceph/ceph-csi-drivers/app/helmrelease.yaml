---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ceph-csi-drivers
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: ceph-csi-drivers
      version: 1.0.4
      sourceRef:
        # No namespace: the ks targetNamespace rewrites the HelmRepository into
        # rook-ceph, so this must resolve against the HelmRelease's own namespace
        kind: HelmRepository
        name: ceph-csi-operator
      interval: 1h
  values:
    # Rook-compatible values, see
    # https://github.com/rook/rook/blob/v1.20.6/deploy/charts/ceph-csi-drivers/values.yaml
    # The driver names must match the provisioner names Rook writes into
    # StorageClasses and VolumeSnapshotClasses.
    #
    # Settings beyond that file reproduce what the live Driver CRs already
    # carry, so Helm adoption does not quietly change the running drivers.
    # cephConnection and clientProfile are deliberately not configured here:
    # the rook operator creates and owns those CRs itself.
    operatorConfig:
      namespace: rook-ceph
      driverSpecDefaults:
        cephFsClientType: kernel
        clusterName: home-ops
        deployCsiAddons: false
        fsGroupPolicy: File
        generateOMapInfo: false
        imageSet:
          name: rook-csi-operator-image-set-configmap
        # No log-rotate sidecar runs today; the chart default would add one
        log:
          rotation:
            enabled: false
        controllerPlugin:
          deploymentStrategy:
            type: Recreate
          hostNetwork: true
          imagePullPolicy: IfNotPresent
          priorityClassName: system-cluster-critical
          replicas: 2
        nodePlugin:
          enableSeLinuxHostMount: false
          imagePullPolicy: IfNotPresent
          kubeletDirPath: /var/lib/kubelet
          priorityClassName: system-node-critical
    drivers:
      rbd:
        enabled: true
        name: rook-ceph.rbd.csi.ceph.com
        log:
          rotation:
            enabled: false
        controllerPlugin:
          replicas: 2
      cephfs:
        enabled: true
        name: rook-ceph.cephfs.csi.ceph.com
        # Already set on the live cephfs Driver CR
        snapshotPolicy: volumeGroupSnapshot
        log:
          rotation:
            enabled: false
        controllerPlugin:
          replicas: 2
      nfs:
        enabled: false
        name: rook-ceph.nfs.csi.ceph.com
      nvmeof:
        enabled: false
        name: rook-ceph.nvmeof.csi.ceph.com
