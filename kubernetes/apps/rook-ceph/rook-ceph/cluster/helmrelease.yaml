---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
spec:
  interval: 1h
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: rook-ceph-cluster
  dependsOn:
    - name: rook-ceph-operator
      namespace: rook-ceph
    - name: snapshot-controller
      namespace: kube-system
  driftDetection:
    mode: disabled
  values:
    # Pinned so a Rook chart bump cannot drag a Ceph MAJOR along with it.
    # Unpinned, the chart default decides: v1.19.5 defaults to Ceph v19.2.3
    # (squid) but v1.20.6 defaults to v20.2.4 (tentacle), so #903 would have
    # upgraded Rook AND Ceph in one merge.
    #
    # Rook 1.20 supports both - supportedVersions = [Squid, Tentacle], minimum
    # 19.2.0 - so staying on 19.2.3 across the Rook upgrade is fully supported
    # and lets the Ceph major move separately, on its own change. This is that
    # change: squid -> tentacle, which is also the chart default for 1.20.6.
    #
    # Ceph's third digit encodes maturity: x.0.z is development, x.1.z is a
    # release candidate, x.2.z is stable. v20.2.4 is the newest stable tentacle.
    # v21.1.0 exists in the registry but is an Umbrella RC, and Rook 1.20.6
    # lists Umbrella without putting it in supportedVersions - so #931 is not a
    # target, now or when 21 stabilises, until Rook supports it.
    cephImage:
      repository: quay.io/ceph/ceph
      tag: v20.2.4
    clusterName: "home-ops"
    operatorNamespace: "rook-ceph"
    monitoring:
      enabled: true
      createPrometheusRules: true
    toolbox:
      enabled: true
    route:
      dashboard:
        host:
          name: rook.pospiech.dev
          path: /
          pathType: PathPrefix
        parentRefs:
          - name: envoy-internal
            namespace: network
    cephClusterSpec:
      cephConfig:
        global:
          bdev_enable_discard: "true" # quote
          bdev_async_discard_threads: "1" # quote
          osd_class_update_on_start: "false" # quote
          device_failure_prediction_mode: local # requires mgr module
          osd_pool_default_size: "3"
          osd_pool_default_min_size: "2"
          mon_data_avail_warn: "10"
          mon_data_avail_crit: "5"
        mgr:
          mgr/crash/warn_recent_interval: "7200" # 2h
      cleanupPolicy:
        wipeDevicesFromOtherClusters: true
      crashCollector:
        disable: false
      csi:
        readAffinity:
          enabled: true
      dashboard:
        enabled: true
        urlPrefix: /
        ssl: false
        prometheusEndpoint: http://prometheus-operated.observability.svc.cluster.local:9090
      # The four AUTH_INSECURE_* checks are the expected steady state while the
      # CSI keys stay on cipher aes, which they must until the nodes reach Linux
      # kernel 7.0. Rook's own docs expect this to "last years", and Ceph's docs
      # call muting "typical" here - its QA suite mutes the client check whenever
      # tests use the kernel client. CVE-2025-30156 is already resolved by the
      # mon/mgr/osd/mds rotation in #935 plus the Ceph 20 upgrade in #937.
      #
      # Without this, CephClusterWarningState fires continuously for months and
      # trains us to ignore the one alert that says Ceph is unwell.
      #
      # ROTATING_SERVICE_KEY_TYPE is currently clear but muted anyway: it
      # reappears for two to three hours after every daemon key rotation while
      # the service tokens re-mint, and that transient should not page.
      #
      # Rook mutes with `ceph health mute --sticky`, so these stay hidden even if
      # the entity count GROWS - a sixth insecure key would not resurface. That is
      # acceptable only because Rook creates the CSI keys itself, with the keyType
      # pinned in security.cephx below.
      #
      # To undo, set `policy: unmute`. Do NOT just delete this block: Rook only
      # iterates over declared entries (cephstatus.go), so a removed key is never
      # reconciled away and the mute would persist in Ceph forever.
      healthCheck:
        muteHealthWarning:
          AUTH_INSECURE_CLIENT_KEY_TYPE:
            policy: mute
          AUTH_INSECURE_KEYS_ALLOWED:
            policy: mute
          AUTH_INSECURE_KEYS_CREATABLE:
            policy: mute
          AUTH_INSECURE_ROTATING_SERVICE_KEY_TYPE:
            policy: mute
      mgr:
        count: 2
        activeStandby: true
        modules:
          - name: diskprediction_local
            enabled: true
          - name: insights
            enabled: true
          - name: pg_autoscaler
            enabled: true
          - name: rook
            enabled: true
      network:
        provider: host
        connections:
          requireMsgr2: true
      resources:
        mgr:
          limits:
            memory: 2Gi
        osd:
          limits:
            memory: 8Gi
      # Ceph flags cipher `aes` as HEALTH_ERR (AUTH_INSECURE_SERVICE_KEY_TYPE).
      # The monmap already has auth_service_cipher/auth_preferred_cipher aes256k,
      # so rotation produces aes256k without naming keyType here - but keyType is
      # a no-op anyway unless keyRotationPolicy is set, which is why nothing had
      # rotated on its own. The operator logging "enabling cephx key rotation"
      # only means it is willing to, not that a policy asked it to.
      #
      # Generation 2, not 1: keys predate the per-group generation counter, and
      # rotation only fires when the value exceeds the current generation.
      #
      # allowedCiphers is deliberately NOT set. Restricting auth to aes256k while
      # the CSI keys are still aes locks out the clients that mount the PVs, so it
      # can only follow a CSI rotation, which needs kernel 7.0 first. Until then
      # AUTH_INSECURE_CLIENT_KEY_TYPE / KEYS_ALLOWED / KEYS_CREATABLE stay as
      # warnings and the cluster sits at HEALTH_WARN, not HEALTH_ERR.
      security:
        cephx:
          daemon:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 2
          # CSI stays on `aes`: aes256k needs the in-kernel Ceph client from
          # Linux 7.0 and all four nodes run 6.18.29-talos. Rotating these would
          # lock the kernel mounts out of every RBD/CephFS volume in the cluster.
          # This is the chart default, restated so a chart bump cannot move it.
          csi:
            keyType: aes
      storage:
        useAllNodes: false
        useAllDevices: false
        nodes:
          - name: goku
            devices:
              - name: /dev/disk/by-id/nvme-Samsung_SSD_990_PRO_2TB_S7PJNJ0L103992Z
          - name: zordon
            devices:
              - name: /dev/disk/by-id/nvme-XPG_GAMMIX_S70_BLADE_2N482917S5WT
          - name: kirito
            devices:
              - name: /dev/disk/by-id/nvme-Samsung_SSD_990_PRO_2TB_S7PJNJ0L103976J
          - name: kakashi
            devices:
              - name: /dev/disk/by-id/nvme-XPG_GAMMIX_S70_BLADE_2N482LA7CQF2
        config:
          osdsPerDevice: "1"
      mon:
        count: 3
        allowMultiplePerNode: false
    cephBlockPools:
      - name: ceph-block
        spec:
          failureDomain: host
          replicated:
            size: 3
        storageClass:
          enabled: true
          name: ceph-block
          isDefault: true
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          parameters:
            imageFormat: "2"
            imageFeatures: layering
            # imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4
      - name: builtin-mgr
        spec:
          name: .mgr
          failureDomain: host
          replicated:
            size: 3
            requireSafeReplicaSize: false
          parameters:
            min_size: "2"
            compression_mode: none
        storageClass:
          enabled: false
    cephBlockPoolsVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-blockpool
      isDefault: false
      deletionPolicy: Delete
    cephFileSystems:
      - name: &cephFileSystemName ceph-filesystem
        spec:
          metadataPool:
            replicated:
              size: 3
          dataPools:
            - failureDomain: host
              replicated:
                size: 3
              name: data0
          metadataServer:
            activeCount: 1
            activeStandby: true
            priorityClassName: system-cluster-critical
            placement:
              topologySpreadConstraints:
                - maxSkew: 1
                  topologyKey: kubernetes.io/hostname
                  whenUnsatisfiable: DoNotSchedule
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: ceph-mds
                      app.kubernetes.io/part-of: *cephFileSystemName
            resources:
              requests:
                cpu: 1000m
                memory: 4Gi
              limits:
                memory: 4Gi
        storageClass:
          enabled: true
          isDefault: false
          name: ceph-filesystem
          pool: data0
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          mountOptions:
            - ms_mode=prefer-crc
          parameters:
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4
    cephFileSystemVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-filesystem
      isDefault: false
      deletionPolicy: Delete

    cephObjectStores: []
