---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name poetica-amd64
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set
  values:
    githubConfigUrl: https://github.com/poetica-pl
    githubConfigSecret: poetica-amd64-secret
    minRunners: 0
    maxRunners: 4
    containerMode:
      type: kubernetes
      kubernetesModeWorkVolumeClaim:
        accessModes:
          - "ReadWriteOnce"
        storageClassName: openebs-hostpath
        resources:
          requests:
            storage: 25Gi
    controllerServiceAccount:
      name: actions-runner-controller
      namespace: actions-runner-system
    template:
      spec:
        imagePullSecrets:
          - name: poetica-amd64-ghcr
        securityContext:
          supplementalGroups:
            - 123
        initContainers:
          - name: dind
            image: public.ecr.aws/docker/library/docker:29-dind
            restartPolicy: Always
            command:
              - sh
              - -c
              - |
                iptables -t mangle -A POSTROUTING -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --set-mss 1400
                ip6tables -t mangle -A POSTROUTING -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --set-mss 1400 || true
                exec dockerd --host=unix:///var/run/docker.sock --group=$(DOCKER_GROUP_GID) --mtu=1500 --dns=10.0.42.1
            env:
              - name: DOCKER_TLS_CERTDIR
                value: ""
              - name: DOCKER_GROUP_GID
                value: "123"
            securityContext:
              privileged: true
            volumeMounts:
              - mountPath: /var/run
                name: docker-sock
              - mountPath: /var/lib/docker
                name: docker-storage
        containers:
          - name: runner
            # Custom Poetica runner image: the upstream base plus Flutter, the
            # Android SDK, Node and Playwright, so mobile-ci.yml and
            # e2e-live.yaml do not reinstall them per job.
            #
            # Published to GHCR rather than registry.pospiech.dev, whose
            # Cloudflare proxy caps request bodies below this image's size —
            # pushes failed there, which is how the previous pin went stale,
            # stopped starting, and left this scale set without a listener.
            #
            # The package is PRIVATE, so the pod needs the imagePullSecret
            # declared below; there is no anonymous pull for it.
            #
            # Bakes Flutter 3.44.9 / Dart 3.12.2. The Linux mobile-ci jobs call
            # `flutter` straight from the image's /opt/flutter with no setup
            # step, so this digest — not mobile-ci.yml's FLUTTER_VERSION, which
            # only feeds the macOS jobs — decides the SDK every Linux mobile
            # job runs against.
            image: ghcr.io/poetica-pl/gh-runners/poetica:rolling@sha256:2c99de39af42d020d5947f427e1bed72d27bf3e65f3c5820481a6d56332d1a9f
            command:
              - "/home/runner/run.sh"
            env:
              - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
                value: "false"
              - name: DOCKER_HOST
                value: "unix:///var/run/docker.sock"
              # 120s to match the two scale sets already running this image.
              # The old 20s was tuned for the custom build, which started
              # dockerd faster than the stock image does.
              - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
                value: "120"
              - name: NODE
                valueFrom:
                  fieldRef:
                    fieldPath: status.hostIP
            volumeMounts:
              - mountPath: /var/run
                name: docker-sock
        serviceAccountName: *name
        volumes:
          - name: docker-sock
            emptyDir: {}
          - name: docker-storage
            emptyDir: {}
