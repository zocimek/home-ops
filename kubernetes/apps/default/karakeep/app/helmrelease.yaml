---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: karakeep
spec:
  interval: 30m
  # meilisearch's v1.44 -> v1.53 dumpless upgrade runs past the 5m the
  # cluster-wide patch grants every HelmRelease, so #914's fix could not land:
  # Helm applied the corrected args, meilisearch began migrating, the wait
  # timed out, and remediation rolled back to the release that still carries
  # the removed --experimental-dumpless-upgrade flag. Releases v42 failed and
  # v43 went pending-rollback on a loop.
  #
  # Only the timeout works here - cluster-apps patches upgrade.remediation
  # over every HelmRelease - so the remediation half lives in
  # kubernetes/flux/cluster/ks.yaml, as it does for authentik.
  timeout: 30m
  chartRef:
    kind: OCIRepository
    name: karakeep
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"

    controllers:
      karakeep:
        forceRename: karakeep
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/karakeep-app/karakeep
              tag: latest@sha256:ac1e465d331c44860cf5905e045c8b4719f560b57366bf856a3f0cbab53a1467
            env:
              BROWSER_WEB_URL: http://karakeep-chrome.default.svc.cluster.local:9222
              CRAWLER_DOWNLOAD_BANNER_IMAGE: true
              CRAWLER_ENABLE_ADBLOCKER: true
              CRAWLER_STORE_SCREENSHOT: true
              CRAWLER_VIDEO_DOWNLOAD: true
              CRAWLER_FULL_PAGE_ARCHIVE: true
              CRAWLER_NUM_WORKERS: 4
              DATA_DIR: /data
              DISABLE_SIGNUPS: false
              DISABLE_PASSWORD_AUTH: "true"
              MEILI_ADDR: http://karakeep-meilisearch.default.svc.cluster.local:7700
              NEXTAUTH_URL: https://karakeep.pospiech.dev
              DISABLE_NEW_RELEASE_CHECK: true
              COREPACK_INTEGRITY_KEYS: 0
              OAUTH_PROVIDER_NAME: "SSO"
              OPENAI_BASE_URL: https://openrouter.ai/api/v1
              INFERENCE_TEXT_MODEL: gpt-4.1-nano
              INFERENCE_IMAGE_MODEL: gpt-4o-mini

            envFrom:
              - secretRef:
                  name: karakeep
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi

      chrome:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: gcr.io/zenika-hub/alpine-chrome
              tag: 124
            command:
              - chromium-browser
            args:
              - --headless
              - --no-sandbox
              - --disable-gpu
              - --disable-dev-shm-usage
              - --remote-debugging-address=0.0.0.0
              - --remote-debugging-port=9222
              - --hide-scrollbars
            securityContext:
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi

      meilisearch:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchExpressions:
                      - key: app.kubernetes.io/name
                        operator: In
                        values:
                          - karakeep
                      - key: app.kubernetes.io/controller
                        operator: In
                        values:
                          - karakeep
                  topologyKey: kubernetes.io/hostname
        containers:
          app:
            image:
              repository: docker.io/getmeili/meilisearch
              tag: v1.53.1
            args:
              # No --experimental-dumpless-upgrade: Meilisearch stabilized
              # dumpless upgrade in v1.51.0 and removed the flag with it, so
              # v1.53.1 exits with "unexpected argument". The behaviour the
              # flag gated is now the default, so dropping it keeps
              # upgrade-in-place rather than losing it.
              - /bin/meilisearch
            env:
              MEILI_NO_ANALYTICS: true
              # Meilisearch will not migrate its on-disk database silently:
              # v1.53.1 refuses to start against a v1.44.0 database unless this
              # is set. Stabilizing dumpless upgrade in v1.51.0 RENAMED
              # --experimental-dumpless-upgrade to --upgrade-db, it did not make
              # the migration automatic. No-op when no migration is pending, so
              # it stays set for the next upgrade.
              MEILI_UPGRADE_DB: true
              MEILI_MASTER_KEY:
                valueFrom:
                  secretKeyRef:
                    name: karakeep
                    key: MEILI_MASTER_KEY
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 4Gi

    service:
      app:
        forceRename: karakeep
        primary: true
        controller: karakeep
        ports:
          http:
            port: &httpPort 3000
      chrome:
        controller: chrome
        ports:
          http:
            port: 9222
      meilisearch:
        controller: meilisearch
        ports:
          http:
            port: 7700

    persistence:
      data:
        existingClaim: karakeep
        advancedMounts:
          karakeep:
            app:
              - path: /data
                subPath: karakeep
          meilisearch:
            app:
              - path: /meili_data
                subPath: meilisearch

    route:
      app:
        hostnames:
          - karakeep.pospiech.dev
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *httpPort
