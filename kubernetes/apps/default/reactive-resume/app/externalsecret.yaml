---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secretName reactive-resume
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *secretName
    template:
      data:
        # openssl rand -hex 32
        AUTH_SECRET: "{{ .AUTH_SECRET }}"
        # openssl rand -hex 32 (must be at least 32 characters)
        ENCRYPTION_SECRET: "{{ .ENCRYPTION_SECRET }}"

        # Authentik OIDC provider
        OAUTH_CLIENT_ID: "{{ .OIDC_CLIENT_ID }}"
        OAUTH_CLIENT_SECRET: "{{ .OIDC_CLIENT_SECRET }}"

        # Upstream SMTP. Reactive Resume always authenticates against the SMTP
        # server, so it cannot use the unauthenticated smtp-relay in this namespace.
        SMTP_HOST: "{{ .SMTP_HOST }}"
        SMTP_USER: "{{ .SMTP_USERNAME }}"
        SMTP_PASS: "{{ .SMTP_PASSWORD }}"
  dataFrom:
    - extract:
        key: reactive-resume
    - extract:
        key: smtp

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secretName reactive-resume-db-secret
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: crunchy-pgo-secrets
  target:
    name: *secretName
    template:
      type: Opaque
      data:
        DATABASE_URL: '{{ index . "uri" }}'
  dataFrom:
    - extract:
        key: postgres-pguser-resume
