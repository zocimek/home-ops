---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secretName homelab-manager-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *secretName
    template:
      engineVersion: v2
      data:
        # Read only while auth_users is empty, i.e. the very first start.
        # Changing them later does nothing - reset by deleting the row from
        # the SQLite file. Unset ADMIN_PASSWORD boots the app as
        # admin/changeme, so this is the one field that must not be missing.
        ADMIN_USERNAME: "{{ .ADMIN_USERNAME }}"
        ADMIN_PASSWORD: "{{ .ADMIN_PASSWORD }}"

        # Signs the homelab_session cookie. openssl rand -hex 32
        SESSION_SECRET: "{{ .SESSION_SECRET }}"

        # Fernet key encrypting every stored device credential at rest. Must
        # be urlsafe-base64 32 bytes, not plain hex:
        #   python -c "from cryptography.fernet import Fernet; \
        #     print(Fernet.generate_key().decode())"
        # backend/credentials_crypto.py validates it at startup, so a wrong
        # format fails loudly rather than silently. There is no rotation path
        # and losing it makes every stored credential undecryptable.
        CREDENTIAL_KEY: "{{ .CREDENTIAL_KEY }}"
  dataFrom:
    - extract:
        key: homelab-manager
