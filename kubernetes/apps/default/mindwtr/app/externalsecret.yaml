---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secretName mindwtr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *secretName
    template:
      data:
        # Bearer token the desktop and mobile clients present to the sync
        # server. Upstream requires at least 20 characters.
        MINDWTR_CLOUD_AUTH_TOKENS: "{{ .AUTH_TOKEN }}"
        # Must be the exact origin the PWA is opened at, scheme included.
        # Upstream accepts only a single origin.
        MINDWTR_CLOUD_CORS_ORIGIN: https://tasks.pospiech.dev
  dataFrom:
    - extract:
        key: mindwtr
