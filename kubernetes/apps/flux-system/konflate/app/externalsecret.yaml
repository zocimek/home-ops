---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secretName konflate-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *secretName
    template:
      engineVersion: v2
      data:
        # The whole secret is envFrom'd into the container, so every key here
        # becomes a KONFLATE_* env var.
        KONFLATE_WEBHOOK_SECRET: "{{ .WEBHOOK_SECRET }}"
        # CLIENT_ID, not APP_ID - a GitHub App has both and konflate wants the
        # client id (Iv23...). renovate-operator reads the numeric APP_ID from
        # this same item.
        KONFLATE_APP_CLIENT_ID: "{{ .CLIENT_ID }}"
        # 1Password fields are single-line, so the PEM is stored base64 encoded
        # and decoded here with `base64 -i key.pem`. Wrapping is fine - Go's
        # decoder ignores newlines.
        #
        # Pasting the RAW pem is the thing to avoid: sprig's b64dec returns the
        # decode error as a string rather than failing, so the Secret would
        # quietly hold "illegal base64 data at input byte 5" and the App auth
        # would fail with something that looks unrelated.
        KONFLATE_APP_PRIVATE_KEY: "{{ .PRIVATE_KEY | b64dec }}"
  # github-app-zocimek is the App installed on the personal account. The
  # Poetica-pl org has its own App, whose credentials never enter this
  # namespace - the konflate reviewing that repo runs in the poetica cluster
  # and reads them from the Poetica.pl vault.
  dataFrom:
    - extract:
        key: konflate
    - extract:
        key: github-app-zocimek
