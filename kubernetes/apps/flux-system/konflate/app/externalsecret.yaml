---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secretName konflate-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *secretName
    template:
      engineVersion: v2
      data:
        # The whole secret is envFrom'd into the container, so every key here
        # becomes a KONFLATE_* env var.
        KONFLATE_WEBHOOK_SECRET: "{{ .WEBHOOK_SECRET }}"
        # CLIENT_ID, not APP_ID - a GitHub App has both and konflate wants the
        # client id (Iv23...). renovate-operator reads the numeric APP_ID from
        # this same item.
        KONFLATE_APP_CLIENT_ID: "{{ .CLIENT_ID }}"
        # nospace is load-bearing. 1Password fields are single-line, so wrapped
        # base64 comes back with SPACES where the newlines were, and Go's
        # decoder skips \r and \n but not spaces - it fails at the first one
        # ("illegal base64 data at input byte 76"). Stripping whitespace makes
        # wrapped and flat input equivalent.
        #
        # It fails quietly without this: sprig's b64dec returns the decode
        # error as a STRING rather than erroring, so the Secret ends up holding
        # "illegal base64 data at input byte 76" and the app rejects it as a
        # malformed key, pointing nowhere near the encoding.
        KONFLATE_APP_PRIVATE_KEY: "{{ .PRIVATE_KEY | nospace | b64dec }}"
  # github-app-zocimek is the App installed on the personal account. The
  # Poetica-pl org has its own App, whose credentials never enter this
  # namespace - the konflate reviewing that repo runs in the poetica cluster
  # and reads them from the Poetica.pl vault.
  dataFrom:
    - extract:
        key: konflate
    - extract:
        key: github-app-zocimek
