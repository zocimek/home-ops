---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coredns
spec:
  chartRef:
    kind: OCIRepository
    name: coredns
  interval: 1h
  values:
    fullnameOverride: coredns
    image:
      repository: mirror.gcr.io/coredns/coredns
    replicaCount: 2
    k8sAppLabelOverride: kube-dns
    serviceAccount:
      create: true
    service:
      name: kube-dns
      clusterIP: 10.43.0.10
    servers:
      - zones:
          - zone: .
            scheme: dns://
            use_tcp: true
        port: 53
        plugins:
          - name: errors
          - name: health
            configBlock: |-
              lameduck 5s
          - name: ready
          - name: kubernetes
            parameters: cluster.local in-addr.arpa ip6.arpa
            configBlock: |-
              pods verified
              fallthrough in-addr.arpa ip6.arpa
          - name: autopath
            parameters: "@kubernetes"
          # The cluster is IPv4-only (podSubnets 10.42.0.0/16), so no pod can
          # route to an AAAA answer — but upstream still hands them out for
          # dual-stacked public names. glibc sorts those last per RFC 6724 and
          # is fine; Go's resolver does not, so a Go client can pick the IPv6
          # address and die on ENETUNREACH. That is how the one remote kustomize
          # resource in the tree (the dragonfly-operator CRD fetched from
          # raw.githubusercontent.com by apps/database/dragonfly) intermittently
          # failed the Image Pull workflow.
          #
          # rcode NOERROR with no answer section is NODATA: clients fall through
          # to the A record instead of being handed an unroutable address. This
          # also shadows AAAA for cluster.local — template runs ahead of
          # kubernetes in the plugin chain — which costs nothing here, as the
          # only dual-stacked Services are headless with IPv4-only endpoints.
          - name: template
            parameters: ANY AAAA
            configBlock: |-
              rcode NOERROR
          # PUBLIC names only — the split-horizon zones are carved out into
          # their own server block below and must not reach these upstreams.
          #
          # 10.0.42.1 is the router, pinned by Talos as the node's only
          # nameserver (talos/patches/global/machine-network.yaml) and also the
          # default gateway. A wobble there took external DNS down with it,
          # failing CI on ENETUNREACH / "Name or service not known". The public
          # resolvers behind it keep public names answering through a blip.
          #
          # policy sequential, not the default random: the router stays first on
          # every query, so 1.1.1.1 is only ever consulted when the router fails
          # at the transport level. forward advances to the next upstream only
          # on a transport error — an rcode such as SERVFAIL is returned to the
          # client untouched (plugin/forward/forward.go, ServeDNS).
          - name: forward
            parameters: . 10.0.42.1 1.1.1.1 9.9.9.9
            configBlock: |-
              policy sequential
          - name: cache
            configBlock: |-
              prefetch 20
              serve_stale
          - name: loop
          - name: reload
          - name: loadbalance
          - name: prometheus
            parameters: 0.0.0.0:9153
          - name: log
            configBlock: |-
              class error

      # Split-horizon zones: the router answers these with internal 10.0.42.x
      # addresses (resume.pospiech.dev -> 10.0.42.201, k8s.pospiech.local ->
      # 10.0.42.21) that no public resolver knows. They therefore get the
      # router and nothing else.
      #
      # Falling these back to 1.1.1.1 would be worse than not failing over at
      # all: the public answer is NXDOMAIN, which the cache plugin stores as a
      # denial for up to the SOA minimum, so a brief router blip would keep
      # internal names dead long after the router came back. Router-only means
      # an outage yields a timeout or SERVFAIL instead — neither is cached as a
      # denial, so these names recover the moment the router does.
      - zones:
          - zone: pospiech.dev
            scheme: dns://
            use_tcp: true
          - zone: pospiech.local
            scheme: dns://
            use_tcp: true
        port: 53
        plugins:
          - name: errors
          # Same NODATA-for-AAAA rule as the public block above. The router
          # only overrides the split-horizon names; anything else under these
          # zones it forwards upstream, where a CDN-fronted record answers with
          # AAAA that no pod here can reach.
          - name: template
            parameters: ANY AAAA
            configBlock: |-
              rcode NOERROR
          - name: forward
            parameters: . 10.0.42.1
          - name: cache
          - name: loop
          - name: reload
          - name: log
            configBlock: |-
              class error
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
