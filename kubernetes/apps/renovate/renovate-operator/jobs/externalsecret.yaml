---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secretName renovate-github-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *secretName
    template:
      engineVersion: v2
      metadata:
        labels:
          # Only enforced when the chart's policy engine is on, but set now so
          # turning it on later doesn't break the job.
          renovate-operator.mogenius.com/allow-ref: "true"
      data:
        APP_ID: "{{ .RENOVATE_APP_ID }}"
        INSTALL_ID: "{{ .RENOVATE_INSTALL_ID }}"
        PEM: "{{ .RENOVATE_PRIVATE_KEY }}"
  dataFrom:
    - extract:
        key: renovate

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secretName renovate-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *secretName
    template:
      engineVersion: v2
      data:
        # The operator envFrom's this whole secret into every discovery and
        # Renovate job, so anything here reaches Renovate as an env var.
        # Mirrors RENOVATE_HOST_RULES from .github/workflows/renovate.yaml so
        # the registry.pospiech.dev images keep getting update PRs.
        # yamllint disable-line rule:line-length
        RENOVATE_HOST_RULES: '[{"matchHost":"registry.pospiech.dev","hostType":"docker","username":"{{ .REGISTRY_USERNAME }}","password":"{{ .REGISTRY_PASSWORD }}"}]'
  dataFrom:
    - extract:
        key: registry-credentials
