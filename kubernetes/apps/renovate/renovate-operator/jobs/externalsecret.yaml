---
# Two GitHub Apps, one per account, so a credential leak reaches only the
# account it was issued for. They cannot share one Secret: the field names are
# identical in both 1Password items, and two `extract`s into one target would
# collide silently, with the second overwriting the first.
#
# App A - installed on the personal account, covers zocimek/*.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secretName renovate-github-app-zocimek
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *secretName
    template:
      engineVersion: v2
      metadata:
        labels:
          # Only enforced when the chart's policy engine is on, but set now so
          # turning it on later doesn't break the job.
          renovate-operator.mogenius.com/allow-ref: "true"
      data:
        # APP_ID is the numeric App ID, not the CLIENT_ID (Iv23...) that
        # konflate reads from this same item.
        APP_ID: "{{ .APP_ID }}"
        INSTALL_ID: "{{ .INSTALL_ID }}"
        PEM: "{{ .PRIVATE_KEY }}"
  dataFrom:
    - extract:
        key: github-app-zocimek

---
# App B - installed on the Poetica-pl org, covers Poetica-pl/*.
#
# This App's PEM necessarily also lives in the Poetica.pl vault, for the
# konflate instance in that cluster. That is the limit of the split: renovate
# runs here and has to reach Poetica-pl, so this cluster holds a key to both
# accounts. What the split does buy is the reverse direction - nothing in the
# poetica cluster can touch zocimek/*.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secretName renovate-github-app-poetica
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *secretName
    template:
      engineVersion: v2
      metadata:
        labels:
          renovate-operator.mogenius.com/allow-ref: "true"
      data:
        APP_ID: "{{ .APP_ID }}"
        INSTALL_ID: "{{ .INSTALL_ID }}"
        PEM: "{{ .PRIVATE_KEY }}"
  dataFrom:
    - extract:
        key: github-app-poetica

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secretName renovate-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *secretName
    template:
      engineVersion: v2
      data:
        # The operator envFrom's this whole secret into every discovery and
        # Renovate job, so anything here reaches Renovate as an env var.
        # Mirrors RENOVATE_HOST_RULES from .github/workflows/renovate.yaml so
        # the registry.pospiech.dev images keep getting update PRs.
        # yamllint disable-line rule:line-length
        RENOVATE_HOST_RULES: '[{"matchHost":"registry.pospiech.dev","hostType":"docker","username":"{{ .REGISTRY_USERNAME }}","password":"{{ .REGISTRY_PASSWORD }}"}]'
  dataFrom:
    - extract:
        key: registry-credentials
